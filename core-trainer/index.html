<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,system-ui,sans-serif}
body{background:#111;color:#eee;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:480px;padding:20px}h1{font-size:22px;margin-bottom:16px;font-weight:600}
.card{background:#1c1c1e;border-radius:14px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:13px;color:#8e8e93;display:block;margin-bottom:6px}
input{background:#2c2c2e;border:none;color:#eee;border-radius:10px;padding:12px;font-size:18px;width:100%;text-align:center}
button{border:none;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:600;cursor:pointer;color:#fff;background:#2c2c2e}
.pri{background:#ff9f0a;color:#000}.full{width:100%;margin-top:8px}.sub{color:#8e8e93;font-size:14px}
.ex{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #2c2c2e;font-size:15px}.ex:last-child{border:none}
.ex span:first-child{color:#8e8e93;width:28px}.ex span:nth-child(2){flex:1}
.hidden{display:none!important}
#run{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#3a3a3c;overflow:hidden;padding:20px;text-align:center}
.bar{position:absolute;bottom:0;left:0;right:0;height:100%;z-index:0;transition:height .2s linear}#run>*:not(.bar){position:relative;z-index:1}
#rLabel{font-size:15px;letter-spacing:2px;text-transform:uppercase;opacity:.8}#rName{font-size:30px;font-weight:700;margin-top:4px}
#fig{width:100%;max-width:420px;height:auto;margin:10px 0}
#rTime{font-size:84px;font-weight:200;font-variant-numeric:tabular-nums;line-height:1}
#rInfo{font-size:16px;opacity:.8;margin-top:8px}#rNext{font-size:15px;opacity:.6;margin-top:4px}
.ctrl{display:flex;gap:12px;margin-top:28px}.ctrl button{background:rgba(255,255,255,.2);min-width:90px}
</style></head><body><div class="app">
<div id="setup"><h1>Core Trainer</h1>
<div class="card grid"><div><label>Minutes</label><input id="mins" type="number" min="1" value="15"></div>
<div><label>Work (s)</label><input id="work" type="number" min="5" value="50"></div>
<div><label>Rest (s)</label><input id="rest" type="number" min="0" value="10"></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><b>Your workout</b><span class="sub" id="sum"></span></div><div id="plan"></div></div>
<button class="full" onclick="gen()">↻ Shuffle exercises</button>
<button class="pri full" onclick="start()">Start</button></div>
<div id="run" class="hidden"><div class="bar" id="bar"></div><div id="rLabel"></div><div id="rName"></div>
<svg id="fig" viewBox="0 0 300 190"></svg><div id="rTime"></div><div id="rInfo"></div><div id="rNext"></div>
<div class="ctrl"><button id="pBtn" onclick="pause()">Pause</button><button onclick="skip()">Skip</button><button onclick="stop()">Stop</button></div></div>
</div>
<script src="bgtimer.js"></script>
<script>
const HP=[190,90,90,12,12],FP=[190,90,180,12,12];
// [name, poseA, poseB, seconds per cycle, alternating limbs]  pose=[torso,upperArm,forearm,thigh,shin] angles in deg
const EX=[["Hollow body rocks", [195, 195, 195, -20, -20], [212, 212, 212, -5, -5], 1.2], ["Hollow body hold", [195, 195, 195, -18, -18], [196, 196, 196, -17, -17], 3], ["V-ups", [182, 182, 182, -2, -2], [235, -60, -60, -55, -55], 1.6], ["Tuck-ups", [182, 182, 182, -2, -2], [235, -30, -30, -110, 0], 1.4], ["Dead bugs", [180, -90, -90, -90, 0], [180, 185, 185, -5, -5], 2, 3], ["Leg raises", [180, 180, 180, -90, -90], [180, 180, 180, -8, -8], 2.5], ["Reverse crunches", [180, 5, 5, -90, 0], [195, 5, 5, -140, -30], 1.6], ["Flutter kicks", [185, 10, 10, -22, -22], [185, 10, 10, -6, -6], 0.5, 1], ["Scissor kicks", [185, 10, 10, -35, -35], [185, 10, 10, -2, -2], 0.8, 1], ["Russian twists", [238, 20, -20, -35, 20], [230, 40, 90, -38, 18], 1.4], ["Forearm plank", [193, 90, 180, 13, 13], [193.5, 90, 180, 13.5, 13.5], 3], ["Body saw", [193, 65, 180, 13, 13], [193, 118, 180, 13, 13], 2, 0, null, "el"], ["Plank to pike", [206, 90, 90, 26, 26], [155, 115, 115, 85, 85], 1.8, 0, [180, 100, 100, 55, 55]], ["Mountain climbers", [206, 90, 90, 26, 26], [206, 90, 90, 185, 60], 0.6, 1, [206, 90, 90, 105, -20]], ["Cross-body mountain climbers", [206, 90, 90, 26, 26], [206, 90, 90, 175, 50], 0.7, 1, [206, 90, 90, 100, -15]], ["Side plank hip dips", [193, 270, 270, 13, 13], [201, 270, 270, 20, 20], 1.4], ["Side plank hold", [193, 270, 270, 13, 13], [193, 270, 270, 13, 13], 3], ["Hollow body flutters", [195, 195, 195, -25, -25], [195, 195, 195, -8, -8], 0.5, 1], ["Boat hold", [235, -30, -30, -50, -50], [234, -29, -29, -51, -51], 3], ["Seated in-and-outs", [230, 60, 60, -25, -25], [255, 60, 60, -80, 40], 1.2], ["Toe touches", [182, -80, -80, -90, -90], [212, -50, -50, -90, -90], 1.3], ["Plank leg lifts", [206, 90, 90, 26, 26], [206, 90, 90, 5, 5], 1.4, 2], ["Bear hold", [180, 90, 90, 95, 40], [180, 90, 90, 100, 38], 3], ["Full sit-ups", [180, 200, 200, -45, 45], [275, 10, 10, -45, 45], 1.6], ["Bicycle crunches", [198, -120, 117, -70, 15], [193, -120, 117, -15, -15], 1.2, 1], ["Reverse plank leg raises", [206, 90, 90, 26, 26], [206, 90, 90, -5, -5], 1.4, 2], ["Reverse plank hold", [193, 90, 90, 13, 13], [193.5, 90, 90, 13.5, 13.5], 3],["Superman holds", [188, 188, 188, -6, -6], [192, 192, 192, -12, -12], 2.2], ["Boat-to-hollow rocks", [235, -30, -30, -50, -50], [195, 195, 195, -18, -18], 1.8], ["Penguins (ankle touches)", [188, 15, 15, -62, 118], [188, 45, 55, -62, 118], 0.9, 1]];
const COL=['#ff9f0a','#0a84ff','#30d158','#bf5af2','#ff375f','#64d2ff','#ffd60a'],REST='#636366';
// Exercises done face-down (prone). Eyes are drawn toward the floor for these and
// toward the sky for everything else, so prone/supine look-alikes read apart.
const PRONE=new Set(['Forearm plank','Body saw','Plank to pike','Mountain climbers','Cross-body mountain climbers','Plank leg lifts','Bear hold','Superman holds']);
// Front-on views (body turned toward the viewer) get two eyes + a mouth; every other
// exercise is drawn side-on and gets a profile face (one eye + a mouth).
const FRONT=new Set([]);
const $=id=>document.getElementById(id),fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let plan=[],timer=null,audio=null,wl=null,raf=null,dispIv=null,lastIdx=-1,curPhase=null,curCx=0,animAt=0;
const cfg=JSON.parse(localStorage.getItem('corecfg')||'{"m":15,"w":50,"r":10}');$('mins').value=cfg.m;$('work').value=cfg.w;$('rest').value=cfg.r;
function vals(){const m=Math.max(1,+$('mins').value||1),w=Math.max(5,+$('work').value||5),r=Math.max(0,+$('rest').value||0);
localStorage.setItem('corecfg',JSON.stringify({m,w,r}));return{m,w,r,n:Math.max(1,Math.floor(m*60/(w+r)))}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function gen(){const v=vals();plan=[];while(plan.length<v.n){let s=shuffle(EX.map((_,i)=>i));if(plan.length&&s[0]===plan[plan.length-1])s.push(s.shift());plan.push(...s)}
plan=plan.slice(0,v.n);
(function(){var fp=EX.findIndex(function(e){return e[0]==='Forearm plank'});if(fp<0)return;var j=plan.indexOf(fp);if(j>0){var t=plan[0];plan[0]=plan[j];plan[j]=t}else if(j<0){plan[0]=fp}if(plan.length>1&&plan[1]===fp){for(var k=2;k<plan.length;k++){if(plan[k]!==fp){var u=plan[1];plan[1]=plan[k];plan[k]=u;break}}}})();
$('sum').textContent=v.n+' exercises · '+fmt(v.n*(v.w+v.r));
$('plan').innerHTML=plan.map((e,i)=>`<div class="ex"><span>${i+1}</span><span>${EX[e][0]}</span><span class="sub">${v.w}s</span></div>`).join('')}
['mins','work','rest'].forEach(id=>$(id).addEventListener('change',gen));
// ---- figure ----
const LEN={tor:46,ua:25,fa:24,th:33,sh:31},rad=d=>d*Math.PI/180;
const lerpA=(a,b,p)=>a+(((b-a)%360+540)%360-180)*p;
const mix=(A,B,p)=>A.map((a,i)=>lerpA(a,B[i],p));
const go=(p,ang,l)=>[p[0]+l*Math.cos(rad(ang)),p[1]+l*Math.sin(rad(ang))];
function limbs(P){const hip=[0,0],sh=go(hip,P[0],LEN.tor),el=go(sh,P[1],LEN.ua),ha=go(el,P[2],LEN.fa),kn=go(hip,P[3],LEN.th),ft=go(kn,P[4],LEN.sh),hd=go(sh,P[0],15);return{hip,sh,el,ha,kn,ft,hd}}
function path(e,p){return e[5]?(p<.5?mix(e[1],e[5],p*2):mix(e[5],e[2],p*2-1)):mix(e[1],e[2],p)}
function pose(e,p){
  if(e[4]===3){var ar=path(e,p),lr=path(e,1-p),nn=ar.slice(),ff=lr.slice();nn[3]=lr[3];nn[4]=lr[4];ff[3]=ar[3];ff[4]=ar[4];ff[0]=nn[0];return{n:limbs(nn),f:limbs(ff)}}
  const n=path(e,p),f=e[4]===1?path(e,1-p):e[4]===2?path(e,0):n.slice();f[0]=n[0];return{n:limbs(n),f:limbs(f)}}
function ext(e){let x0=1e9,x1=-1e9;[0,1].forEach(p=>{const q=pose(e,p);[q.n,q.f].forEach(L=>Object.values(L).forEach(([x])=>{x0=Math.min(x0,x);x1=Math.max(x1,x)}))});return (x0+x1)/2}
const ln=(a,b,w,c)=>`<line x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${b[0].toFixed(1)}" y2="${b[1].toFixed(1)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
function drawFig(e,p,cx){const q=pose(e,p),G=168;let my=-1e9;[q.n,q.f].forEach(L=>Object.entries(L).forEach(([k,[,y]])=>{my=Math.max(my,y+(k==='hd'?11:(k==='hip'||k==='sh')?10:5))}));
let dx=150-cx;if(e[6]){const q0=pose(e,0);dx+=q0.n[e[6]][0]-q.n[e[6]][0]}const dy=G-my,T=L=>{const o={};for(const k in L)o[k]=[L[k][0]+dx,L[k][1]+dy];return o},N=T(q.n),F=T(q.f);
const far='rgba(255,255,255,.45)',skin='#fff',sh='rgba(0,0,0,.18)';const sx=(N.hip[0]+N.sh[0])/2;
let s=`<ellipse cx="${sx}" cy="${G+6}" rx="70" ry="5" fill="${sh}"/><line x1="10" y1="${G+5}" x2="290" y2="${G+5}" stroke="rgba(255,255,255,.25)" stroke-width="2"/>`;
s+=ln(F.hip,F.kn,13,far)+ln(F.kn,F.ft,10,far)+`<circle cx="${F.ft[0]}" cy="${F.ft[1]}" r="5" fill="${far}"/>`;
s+=ln(F.sh,F.el,10,far)+ln(F.el,F.ha,8,far)+`<circle cx="${F.ha[0]}" cy="${F.ha[1]}" r="4.5" fill="${far}"/>`;
s+=ln(N.hip,N.sh,20,skin)+`<circle cx="${N.hip[0]}" cy="${N.hip[1]}" r="10" fill="${skin}"/>`+`<circle cx="${N.hd[0]}" cy="${N.hd[1]}" r="11" fill="${skin}"/>`;
s+=ln(N.hip,N.kn,14,skin)+ln(N.kn,N.ft,11,skin)+`<circle cx="${N.ft[0]}" cy="${N.ft[1]}" r="5.5" fill="${skin}"/>`;
s+=ln(N.sh,N.el,11,skin)+ln(N.el,N.ha,9,skin)+`<circle cx="${N.ha[0]}" cy="${N.ha[1]}" r="5" fill="${skin}"/>`;
const hd=N.hd;
var ax=hd[0]-N.sh[0],ay=hd[1]-N.sh[1],al=Math.hypot(ax,ay)||1;ax/=al;ay/=al;
var fy=PRONE.has(e[0])?1:-1,px=-ay,py=ax;if((py<0?-1:1)!==fy){px=-px;py=-py;}
var fP=(u,v)=>[(hd[0]+ax*u+px*v).toFixed(1),(hd[1]+ay*u+py*v).toFixed(1)];
if(FRONT.has(e[0])){
var e1=fP(1.6,3),e2=fP(-1.6,3),ma=fP(2,5.5),mb=fP(-2,5.5);
s+=`<circle cx="${e1[0]}" cy="${e1[1]}" r="1.7" fill="#111"/><circle cx="${e2[0]}" cy="${e2[1]}" r="1.7" fill="#111"/><line x1="${ma[0]}" y1="${ma[1]}" x2="${mb[0]}" y2="${mb[1]}" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>`;
}else{
var eye=fP(3,2.5),mc1=fP(-2.5,3.8),mc2=fP(1,4.6);
s+=`<circle cx="${eye[0]}" cy="${eye[1]}" r="1.8" fill="#111"/><line x1="${mc1[0]}" y1="${mc1[1]}" x2="${mc2[0]}" y2="${mc2[1]}" stroke="#111" stroke-width="1.3" stroke-linecap="round"/>`;
}
$('fig').innerHTML=s}
// ---- timer (background-reliable: wall-clock state + pre-scheduled audio via bgtimer.js) ----
function say(t){try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));speechSynthesis.resume()}catch(e){}}
function buildPhases(v){var ph=[];for(var i=0;i<plan.length;i++){ph.push({name:EX[plan[i]][0],sec:v.w,kind:'work',ex:plan[i],num:i});if(i<plan.length-1&&v.r>0)ph.push({name:'Rest',sec:v.r,kind:'rest',ex:plan[i+1],num:i})}return ph}
function requestWake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(function(s){wl=s},function(){})}catch(e){}}
function releaseWake(){try{wl&&wl.release&&wl.release()}catch(e){}wl=null}
function startDisplay(){stopDisplay();dispIv=setInterval(render,120)}
function stopDisplay(){if(dispIv)clearInterval(dispIv);dispIv=null}
function anim(){if(timer&&!timer.done&&curPhase){const e=EX[curPhase.ex];if(!timer.paused&&curPhase.kind!=='rest')animAt+=1/60;const p=(1-Math.cos(2*Math.PI*animAt/e[3]))/2;drawFig(e,curPhase.kind==='rest'?0:p,curCx)}raf=requestAnimationFrame(anim)}
function show(r){$('setup').classList.toggle('hidden',r);$('run').classList.toggle('hidden',!r)}
function start(){const v=vals();if(!plan.length)gen();
  audio=audio||BGTimer.createAudio({title:'Core Trainer'});audio.ensure();audio.keepAlive();
  try{speechSynthesis.speak(new SpeechSynthesisUtterance(''))}catch(e){}
  timer=BGTimer(buildPhases(v),{countdown:3});timer.start();lastIdx=-1;curPhase=null;
  show(true);requestWake();audio.schedule(timer.cues(Date.now()));
  startDisplay();render();if(!raf)anim()}
function render(){
  if(!timer)return;
  const s=timer.state();
  if(s.done)return finishUI();
  const ph=s.phase,bar=$('bar');curPhase=ph;
  if(s.index!==lastIdx){lastIdx=s.index;curCx=ext(EX[ph.ex]);animAt=0;
    say(ph.kind==='rest'?('Rest. Next, '+EX[ph.ex][0]):ph.name);
    bar.style.transition='none';bar.style.height='100%';bar.offsetHeight;bar.style.transition='';
    bar.style.background=ph.kind==='rest'?REST:COL[ph.num%COL.length]}
  $('rLabel').textContent=ph.kind==='rest'?'Rest · up next':'Exercise '+(ph.num+1)+' of '+plan.length;
  $('rName').textContent=EX[ph.ex][0];
  $('rTime').textContent=fmt(Math.max(0,s.left));
  const remain=plan.length-ph.num-1;
  $('rInfo').textContent=ph.kind==='rest'?'':(remain?remain+' to go':'Last one!');
  $('rNext').textContent=(ph.kind==='work'&&remain)?'Next: '+EX[plan[ph.num+1]][0]:'';
  bar.style.height=Math.max(0,s.frac*100)+'%'}
function finishUI(){stopDisplay();
  if(!timer.finished){timer.finished=true;say('Workout complete. Nice work.')}
  timer.done=true;releaseWake();if(audio&&audio.release)audio.release();curPhase=null;
  $('rLabel').textContent='';$('rName').textContent='Done!';$('rTime').textContent='💪';$('rInfo').textContent=plan.length+' exercises';$('rNext').textContent='';$('fig').innerHTML='';
  const b=$('bar');b.style.transition='none';b.style.height='100%';b.style.background='#30d158'}
function pause(){if(!timer||timer.done)return;timer.togglePause();
  if(timer.paused){audio.clear();audio.release&&audio.release()}else{audio.keepAlive();audio.schedule(timer.cues(Date.now()))}
  $('pBtn').textContent=timer.paused?'Resume':'Pause';render()}
function skip(){if(!timer||timer.done)return;
  if(timer.paused){timer.resume();$('pBtn').textContent='Pause'}
  timer.skip();lastIdx=-1;audio.schedule(timer.cues(Date.now()));render()}
function stop(){if(timer)timer.done=true;stopDisplay();if(audio){audio.clear();audio.release&&audio.release()}try{speechSynthesis.cancel()}catch(e){}releaseWake();$('pBtn').textContent='Pause';timer=null;curPhase=null;show(false);gen()}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  if(!timer||timer.done)return;
  if($('run').classList.contains('hidden'))return;
  requestWake();if(audio){audio.ensure();audio.keepAlive();if(!timer.paused)audio.schedule(timer.cues(Date.now()))}render()});
gen();
</script>
<script src="update.js"></script>
