<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Words · Le apps</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/words.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="common.css">
<script src="gate.js"></script>
<style>
body.game { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
.main { flex: 1; display: flex; flex-direction: column; width: 100%; padding-bottom: 8px; min-height: 0; }
.board-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.board { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; height: min(100%, 400px); aspect-ratio: 5 / 6; max-width: 100%; }
.brow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.tile {
  border: 2px solid var(--tile-edge); display: flex; align-items: center; justify-content: center;
  font-size: clamp(1.4rem, 7vw, 2rem); font-weight: 800; text-transform: uppercase; user-select: none;
  aspect-ratio: 1; border-radius: 4px;
}
.tile.filled { border-color: var(--soft); animation: pop .1s; }
.tile.g, .tile.y, .tile.x { color: #fff; border-color: transparent; }
.tile.g { background: var(--good); } .tile.y { background: var(--near); } .tile.x { background: var(--miss); }
.tile.flip { animation: flip .5s ease forwards; }
@keyframes pop { 50% { transform: scale(1.1); } }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.brow.shake { animation: shake .4s; }
.brow.win .tile { animation: bounce .5s ease; }
@keyframes bounce { 40% { transform: translateY(-14px); } 70% { transform: translateY(3px); } }
.kb { display: flex; flex-direction: column; gap: 7px; padding: 8px 4px 0; user-select: none; }
.kr { display: flex; gap: 5px; justify-content: center; }
.kr button {
  flex: 1; max-width: 44px; height: 56px; border: 0; border-radius: 6px; background: var(--key); color: var(--ink);
  font-weight: 700; font-size: 1.05rem; text-transform: uppercase; cursor: pointer; padding: 0; touch-action: manipulation;
}
.kr button.wide { max-width: 66px; flex: 1.5; font-size: .78rem; }
.kr button.g { background: var(--good); color: #fff; } .kr button.y { background: var(--near); color: #fff; } .kr button.x { background: var(--miss); color: #fff; }
.kr .sp { flex: .5; max-width: 22px; }
.end { text-align: center; }
.end .word { font-size: 1.4rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--edge); }
.switch input { width: 46px; height: 26px; accent-color: var(--good); }
</style>
</head>
<body class="game">
<div class="main">
  <div class="board-wrap"><div class="board" id="board"></div></div>
  <div id="end" class="end" style="display:none"></div>
  <div class="kb" id="kb"></div>
</div>
<script src="data/words.js"></script>
<script src="common.js"></script>
<script>
LE.ready(function () {
  var GAME = 'words';
  var VALID = {};
  for (var i = 0; i < WORD_VALID.length; i += 5) VALID[WORD_VALID.substr(i, 5)] = 1;
  WORD_ANSWERS.forEach(function (w) { VALID[w] = 1; });

  var answer, guesses, cur, done, won, hard = LE.get('words:hard', false);
  var boardEl = document.getElementById('board'), kbEl = document.getElementById('kb'), endEl = document.getElementById('end');

  LE.shell({ game: GAME, title: 'Words', help: help, stats: showStats, settings: settings });

  function help() {
    LE.modal('How to play', '<p>Guess the word in 6 tries. Each guess must be a real five-letter word.</p>' +
      '<p><b style="color:var(--good)">Green</b>: right letter, right spot.<br><b style="color:var(--near)">Yellow</b>: in the word, wrong spot.<br><b style="color:var(--soft)">Gray</b>: not in the word.</p>' +
      '<p>A new word every day. Free play gives you a random word any time.</p>');
  }
  function settings() {
    var m = LE.modal('Settings', '<label class="switch"><span><b>Hard mode</b><br><span class="muted" style="font-size:.88rem">Revealed hints must be used in later guesses</span></span><input type="checkbox"></label>');
    var cb = m.body.querySelector('input'); cb.checked = hard;
    cb.onchange = function () {
      if (guesses.length && !done && cb.checked && !hard) { cb.checked = false; LE.toast('Hard mode can only be turned on at the start of a round'); return; }
      hard = cb.checked; LE.set('words:hard', hard);
    };
  }
  function showStats() {
    var m = LE.modal('Statistics', LE.statsHTML(GAME, 6));
    if (done) m.body.appendChild(LE.endActions(GAME, shareText(), newGame));
  }

  function newGame() {
    document.querySelectorAll('.modal-back').forEach(function (m) { m.remove(); });
    if (LE.free) {
      answer = WORD_ANSWERS[Math.floor(Math.random() * WORD_ANSWERS.length)];
      guesses = []; done = won = false;
    } else {
      answer = WORD_ANSWERS[((LE.dayIndex() % WORD_ANSWERS.length) + WORD_ANSWERS.length) % WORD_ANSWERS.length];
      var st = LE.dayState(GAME) || {};
      guesses = st.guesses || []; done = !!st.done; won = !!st.won;
    }
    cur = '';
    build();
    if (done) showEnd(false);
  }

  function score(g, a) {
    var res = ['x', 'x', 'x', 'x', 'x'], left = {};
    for (var i = 0; i < 5; i++) { if (g[i] === a[i]) res[i] = 'g'; else left[a[i]] = (left[a[i]] || 0) + 1; }
    for (i = 0; i < 5; i++) if (res[i] !== 'g' && left[g[i]]) { res[i] = 'y'; left[g[i]]--; }
    return res;
  }

  function build() {
    boardEl.innerHTML = '';
    for (var r = 0; r < 6; r++) {
      var row = LE.el('div', 'brow');
      for (var c = 0; c < 5; c++) row.appendChild(LE.el('div', 'tile'));
      boardEl.appendChild(row);
    }
    guesses.forEach(function (g, r) { paintRow(r, g, false); });
    buildKb();
    endEl.style.display = 'none'; kbEl.style.display = '';
  }
  function paintRow(r, g, animate) {
    var res = score(g, answer), tiles = boardEl.children[r].children;
    for (var i = 0; i < 5; i++) (function (i) {
      var t = tiles[i]; t.textContent = g[i];
      if (animate) {
        setTimeout(function () { t.classList.add('flip'); }, i * 280);
        setTimeout(function () { t.className = 'tile ' + res[i]; }, i * 280 + 250);
      } else t.className = 'tile ' + res[i];
    })(i);
  }
  function keyStates() {
    var ks = {}, rank = { x: 1, y: 2, g: 3 };
    guesses.forEach(function (g) {
      var res = score(g, answer);
      for (var i = 0; i < 5; i++) if (!ks[g[i]] || rank[res[i]] > rank[ks[g[i]]]) ks[g[i]] = res[i];
    });
    return ks;
  }
  function buildKb() {
    var ks = keyStates();
    var rows = ['qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
    kbEl.innerHTML = '';
    rows.forEach(function (r, ri) {
      var row = LE.el('div', 'kr');
      if (ri === 1) row.appendChild(LE.el('div', 'sp'));
      if (ri === 2) { var e = LE.el('button', 'wide', 'Enter'); e.dataset.k = 'enter'; row.appendChild(e); }
      r.split('').forEach(function (ch) { var b = LE.el('button', ks[ch] || '', ch); b.dataset.k = ch; row.appendChild(b); });
      if (ri === 1) row.appendChild(LE.el('div', 'sp'));
      if (ri === 2) { var d = LE.el('button', 'wide', '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m12 9 6 6m0-6-6 6"/></svg>'); d.dataset.k = 'back'; d.setAttribute('aria-label', 'Delete'); row.appendChild(d); }
      kbEl.appendChild(row);
    });
  }
  kbEl.addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) key(b.dataset.k); });
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.modal-back')) return;
    if (e.key === 'Enter') key('enter');
    else if (e.key === 'Backspace') key('back');
    else if (/^[a-zA-Z]$/.test(e.key)) key(e.key.toLowerCase());
  });

  var busy = false;
  function key(k) {
    if (done || busy) return;
    var row = boardEl.children[guesses.length];
    if (k === 'back') { cur = cur.slice(0, -1); }
    else if (k === 'enter') { submit(); return; }
    else if (cur.length < 5) { cur += k; }
    for (var i = 0; i < 5; i++) { var t = row.children[i]; t.textContent = cur[i] || ''; t.className = 'tile' + (cur[i] ? ' filled' : ''); }
  }
  function shake(msg) {
    LE.toast(msg);
    var row = boardEl.children[guesses.length];
    row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake');
  }
  function hardCheck(g) {
    var ord = ['1st', '2nd', '3rd', '4th', '5th'];
    for (var j = 0; j < guesses.length; j++) {
      var p = guesses[j], res = score(p, answer), need = {};
      for (var i = 0; i < 5; i++) {
        if (res[i] === 'g' && g[i] !== p[i]) return ord[i] + ' letter must be ' + p[i].toUpperCase();
        if (res[i] !== 'x') need[p[i]] = (need[p[i]] || 0) + 1;
      }
      for (var ch in need) {
        var have = g.split(ch).length - 1;
        if (have < need[ch]) return 'Guess must contain ' + ch.toUpperCase();
      }
    }
    return null;
  }
  function submit() {
    if (cur.length < 5) return shake('Not enough letters');
    if (!VALID[cur]) return shake('Not in word list');
    if (hard) { var hc = hardCheck(cur); if (hc) return shake(hc); }
    var r = guesses.length; guesses.push(cur);
    busy = true;
    paintRow(r, cur, true);
    var g = cur; cur = '';
    won = g === answer; done = won || guesses.length === 6;
    if (!LE.free) LE.saveDay(GAME, { guesses: guesses, done: done, won: won, n: guesses.length });
    setTimeout(function () {
      busy = false; buildKb();
      if (won) {
        boardEl.children[r].classList.add('win');
        LE.toast(['Genius', 'Magnificent', 'Impressive', 'Splendid', 'Great', 'Phew'][r], 1800);
      } else if (done) LE.toast(answer.toUpperCase(), 2600);
      if (done) {
        if (!LE.free) LE.record(GAME, won, guesses.length);
        setTimeout(function () { showEnd(true); }, 900);
      }
    }, 5 * 280 + 300);
  }

  function shareText() {
    var head = 'Words ' + (LE.free ? '(free play)' : LE.today()) + ' ' + (won ? guesses.length : 'X') + '/6' + (hard ? '*' : '');
    var lines = guesses.map(function (g) {
      return score(g, answer).map(function (s) { return s === 'g' ? '🟩' : s === 'y' ? '🟨' : '⬛'; }).join('');
    });
    return head + '\n\n' + lines.join('\n');
  }
  function showEnd(popup) {
    kbEl.style.display = 'none';
    endEl.style.display = '';
    endEl.innerHTML = '<div class="muted" style="margin-top:6px">' + (won ? 'Solved in ' + guesses.length + '/6' : 'The word was') + '</div><div class="word">' + answer + '</div>';
    endEl.appendChild(LE.endActions(GAME, shareText(), newGame));
    if (popup && !LE.free) showStats();
  }

  newGame();
});
</script>
<script src="update.js"></script>
</body>
</html>
